[project]
name = "conductor"
version = "0.1.0"
description = "Multi-agent code-review and DevOps orchestrator"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "docker>=7",
  "mcp>=1.2,<2",
  "defusedxml>=0.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-docker",
  "types-defusedxml",
  "respx>=0.21",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = [
  "live: calls real LLM providers; needs LIVE_LLM=1 (spends quota)",
  "docker: needs a running Docker daemon and the conductor-sandbox image",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# timeout= is a container wall-clock limit, not an asyncio timeout
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
